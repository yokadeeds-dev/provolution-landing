<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Seite nicht gefunden | PROVOLUTION</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: linear-gradient(135deg, #0D5C3D 0%, #00A8E8 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        .container { max-width: 600px; }
        h1 { font-size: 120px; margin-bottom: 20px; opacity: 0.9; }
        h2 { font-size: 32px; margin-bottom: 20px; }
        p { font-size: 18px; margin-bottom: 40px; opacity: 0.9; }
        a {
            display: inline-block;
            background: white;
            color: #0D5C3D;
            padding: 15px 40px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 700;
            transition: transform 0.3s;
        }
        a:hover { transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <h2>Diese Seite existiert nicht.</h2>
        <p>Aber hey – das Klima wartet nicht. Lass uns zurück zur Mission!</p>
        <a href="/">Zurück zur Startseite</a>
    </div>
</body>
</html>
