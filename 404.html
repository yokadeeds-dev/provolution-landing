<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seite nicht gefunden &middot; Provolution</title>
    <meta name="description" content="Provolution - Seite nicht gefunden.">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #FAFAFA;
            --fg: #1A1A1A;
            --muted: #6B6B6B;
            --rule: #E5E5E5;
        }

        html, body { height: 100%; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg);
            color: var(--fg);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .page {
            min-height: 100vh;
            display: grid;
            grid-template-rows: 1fr auto;
            padding: 32px 24px;
        }

        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 48px;
            max-width: 640px;
            margin: 0 auto;
            width: 100%;
        }

        .brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .brand-name {
            font-size: clamp(2rem, 6vw, 3.25rem);
            font-weight: 600;
            letter-spacing: 0.08em;
            line-height: 1.1;
        }

        .brand-sub {
            font-size: 0.95rem;
            font-weight: 400;
            color: var(--muted);
            letter-spacing: 0.02em;
        }

        .body-text {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .headline {
            font-size: clamp(1.25rem, 3vw, 1.5rem);
            font-weight: 500;
            color: var(--fg);
        }

        .body-text p {
            font-size: 1rem;
            color: var(--muted);
        }

        .body-text a {
            color: var(--fg);
            text-decoration: underline;
            text-underline-offset: 3px;
            text-decoration-thickness: 1px;
        }

        footer {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            padding-top: 32px;
            font-size: 0.85rem;
            color: var(--muted);
        }

        footer a {
            color: var(--muted);
            text-decoration: underline;
            text-underline-offset: 3px;
            text-decoration-thickness: 1px;
            transition: color 0.15s ease;
        }

        footer a:hover,
        footer a:focus-visible {
            color: var(--fg);
        }

        footer a:focus-visible {
            outline: 1px solid var(--fg);
            outline-offset: 4px;
            border-radius: 2px;
        }

        .copy {
            font-size: 0.8rem;
        }

        @media (max-width: 480px) {
            .page { padding: 24px 20px; }
            main { gap: 36px; }
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1A1A1A;
                --fg: #F5F5F5;
                --muted: #9A9A9A;
                --rule: #2A2A2A;
            }
        }
    </style>
</head>
<body>
    <div class="page">
        <main>
            <div class="brand">
                <div class="brand-name">PROVOLUTION</div>
                <div class="brand-sub">Klimatransformations-Framework</div>
            </div>

            <div class="body-text">
                <h1 class="headline">Seite nicht gefunden</h1>
                <p>Diese Adresse existiert auf dieser Domain nicht.</p>
                <p><a href="/">Zur Startseite</a></p>
            </div>
        </main>

        <footer>
            <a href="https://github.com/yokadeeds-dev/Provolution" rel="noopener">Forschungs-Repository auf GitHub</a>
            <div class="copy">&copy; 2026 Tobias Yoka Dietz &middot; Hamm, Deutschland</div>
        </footer>
    </div>
</body>
</html>
