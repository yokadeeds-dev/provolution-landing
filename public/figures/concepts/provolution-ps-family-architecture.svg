<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ps-title ps-desc" style="font-family: Inter, 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <title id="ps-title">Probatio Systemica — Modulare Architektur</title>
  <desc id="ps-desc">Seven evaluation modules with PS-U at the center, six specialized modules in orbit, VFP as input filter and MMM as depth filter.</desc>

  <defs>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.08"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <text x="500" y="38" text-anchor="middle" fill="#1A1A1A" font-size="18" font-weight="600" letter-spacing="0.03em">Probatio Systemica — Modularchitektur</text>

  <!-- VFP -->
  <g transform="translate(500, 88)">
    <rect x="-340" y="-22" width="680" height="44" rx="22" fill="none" stroke="#2F5D4F" stroke-width="1" stroke-dasharray="8,4"/>
    <text x="0" y="1" text-anchor="middle" fill="#2F5D4F" font-size="12" font-weight="600" letter-spacing="0.05em">VFP — VORFILTER-PROTOKOLL</text>
    <text x="0" y="15" text-anchor="middle" fill="#5C6360" font-size="10">Einheit, Prüfbarkeit, Domäne — immer aktiv vor jeder Modul-Anwendung</text>
  </g>

  <line x1="500" y1="112" x2="500" y2="140" stroke="#D4D8D6" stroke-width="1"/>
  <polygon points="496,138 500,146 504,138" fill="#D4D8D6"/>

  <!-- PS-U Center -->
  <g transform="translate(500, 320)" filter="url(#softShadow)">
    <circle r="72" fill="#2F5D4F" opacity="0.08" stroke="#2F5D4F" stroke-width="1.5"/>
    <circle r="58" fill="#FFFFFF" stroke="#2F5D4F" stroke-width="1.25"/>
    <text x="0" y="-14" text-anchor="middle" fill="#2F5D4F" font-size="20" font-weight="700">PS-U</text>
    <text x="0" y="6" text-anchor="middle" fill="#2F5D4F" font-size="10" font-weight="500">Universalis</text>
    <line x1="-28" y1="16" x2="28" y2="16" stroke="#2F5D4F" opacity="0.25" stroke-width="0.75"/>
    <text x="0" y="30" text-anchor="middle" fill="#5C6360" font-size="9">Kernmethodik</text>
    <text x="0" y="42" text-anchor="middle" fill="#5C6360" font-size="9">Tragfähigkeit</text>
  </g>

  <!-- Connection lines -->
  <line x1="448" y1="278" x2="200" y2="200" stroke="#D4D8D6" stroke-width="1"/>
  <line x1="430" y1="320" x2="160" y2="340" stroke="#D4D8D6" stroke-width="1"/>
  <line x1="448" y1="362" x2="200" y2="460" stroke="#D4D8D6" stroke-width="1"/>
  <line x1="552" y1="278" x2="800" y2="200" stroke="#D4D8D6" stroke-width="1"/>
  <line x1="570" y1="320" x2="840" y2="340" stroke="#D4D8D6" stroke-width="1"/>
  <line x1="552" y1="362" x2="800" y2="460" stroke="#D4D8D6" stroke-width="1"/>

  <!-- PV -->
  <g transform="translate(148, 195)">
    <rect x="-68" y="-38" width="136" height="76" rx="6" fill="#FFFFFF" stroke="#5C6360" stroke-width="0.75"/>
    <text x="0" y="-16" text-anchor="middle" fill="#1A1A1A" font-size="15" font-weight="600">PV</text>
    <text x="0" y="0" text-anchor="middle" fill="#5C6360" font-size="10">Veritatis</text>
    <line x1="-24" y1="8" x2="24" y2="8" stroke="#D4D8D6" stroke-width="0.5"/>
    <text x="0" y="22" text-anchor="middle" fill="#9CA3A0" font-size="9">Empirische</text>
    <text x="0" y="33" text-anchor="middle" fill="#9CA3A0" font-size="9">Haltbarkeit</text>
  </g>

  <!-- PD -->
  <g transform="translate(108, 340)">
    <rect x="-68" y="-38" width="136" height="76" rx="6" fill="#FFFFFF" stroke="#5C6360" stroke-width="0.75"/>
    <text x="0" y="-16" text-anchor="middle" fill="#1A1A1A" font-size="15" font-weight="600">PD</text>
    <text x="0" y="0" text-anchor="middle" fill="#5C6360" font-size="10">Deliberativa</text>
    <line x1="-24" y1="8" x2="24" y2="8" stroke="#D4D8D6" stroke-width="0.5"/>
    <text x="0" y="22" text-anchor="middle" fill="#9CA3A0" font-size="9">Prozess-</text>
    <text x="0" y="33" text-anchor="middle" fill="#9CA3A0" font-size="9">SEC-J</text>
  </g>

  <!-- PI -->
  <g transform="translate(148, 460)">
    <rect x="-68" y="-38" width="136" height="76" rx="6" fill="#FFFFFF" stroke="#5C6360" stroke-width="0.75"/>
    <text x="0" y="-16" text-anchor="middle" fill="#1A1A1A" font-size="15" font-weight="600">PI</text>
    <text x="0" y="0" text-anchor="middle" fill="#5C6360" font-size="10">Institutionalis</text>
    <line x1="-24" y1="8" x2="24" y2="8" stroke="#D4D8D6" stroke-width="0.5"/>
    <text x="0" y="22" text-anchor="middle" fill="#9CA3A0" font-size="9">Anspruch</text>
    <text x="0" y="33" text-anchor="middle" fill="#9CA3A0" font-size="9">= Realität</text>
  </g>

  <!-- PN -->
  <g transform="translate(852, 195)">
    <rect x="-68" y="-38" width="136" height="76" rx="6" fill="#FFFFFF" stroke="#5C6360" stroke-width="0.75"/>
    <text x="0" y="-16" text-anchor="middle" fill="#1A1A1A" font-size="15" font-weight="600">PN</text>
    <text x="0" y="0" text-anchor="middle" fill="#5C6360" font-size="10">Narrativa</text>
    <line x1="-24" y1="8" x2="24" y2="8" stroke="#D4D8D6" stroke-width="0.5"/>
    <text x="0" y="22" text-anchor="middle" fill="#9CA3A0" font-size="9">Wer spricht,</text>
    <text x="0" y="33" text-anchor="middle" fill="#9CA3A0" font-size="9">wer fehlt</text>
  </g>

  <!-- PP -->
  <g transform="translate(892, 340)">
    <rect x="-68" y="-38" width="136" height="76" rx="6" fill="#FFFFFF" stroke="#5C6360" stroke-width="0.75"/>
    <text x="0" y="-16" text-anchor="middle" fill="#1A1A1A" font-size="15" font-weight="600">PP</text>
    <text x="0" y="0" text-anchor="middle" fill="#5C6360" font-size="10">Philosophica</text>
    <line x1="-24" y1="8" x2="24" y2="8" stroke="#D4D8D6" stroke-width="0.5"/>
    <text x="0" y="22" text-anchor="middle" fill="#9CA3A0" font-size="9">Logische</text>
    <text x="0" y="33" text-anchor="middle" fill="#9CA3A0" font-size="9">Kohärenz</text>
  </g>

  <!-- PT -->
  <g transform="translate(852, 460)">
    <rect x="-68" y="-38" width="136" height="76" rx="6" fill="#FFFFFF" stroke="#5C6360" stroke-width="0.75"/>
    <text x="0" y="-16" text-anchor="middle" fill="#1A1A1A" font-size="15" font-weight="600">PT</text>
    <text x="0" y="0" text-anchor="middle" fill="#5C6360" font-size="10">Temporalis</text>
    <line x1="-24" y1="8" x2="24" y2="8" stroke="#D4D8D6" stroke-width="0.5"/>
    <text x="0" y="22" text-anchor="middle" fill="#9CA3A0" font-size="9">Score-Drift</text>
    <text x="0" y="33" text-anchor="middle" fill="#9CA3A0" font-size="9">Aktualität</text>
  </g>

  <!-- MMM -->
  <g transform="translate(500, 565)">
    <rect x="-220" y="-18" width="440" height="36" rx="18" fill="none" stroke="#5C6360" stroke-width="0.75" stroke-dasharray="6,4"/>
    <text x="0" y="1" text-anchor="middle" fill="#5C6360" font-size="11" font-weight="500" letter-spacing="0.04em">MMM — MIKRO-MAKRO-MATCHING</text>
    <text x="0" y="14" text-anchor="middle" fill="#9CA3A0" font-size="9">Optionale Skalierungsprüfung bei kausalem Skalenbruch</text>
  </g>

</svg>