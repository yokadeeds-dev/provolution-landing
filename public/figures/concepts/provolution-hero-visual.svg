<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hero-title hero-desc" style="font-family: Inter, 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <title id="hero-title">Provolution Hero Visual</title>
  <desc id="hero-desc">Abstract representation of the Provolution framework — a subtle axis cross with S, E, C, J labels and ten domain letters A through J arranged in a sparse mosaic pattern.</desc>

  <!-- Subtle axis cross -->
  <g transform="translate(420, 300)" opacity="0.12">
    <line x1="-320" y1="0" x2="320" y2="0" stroke="#2F5D4F" stroke-width="1"/>
    <line x1="0" y1="-220" x2="0" y2="220" stroke="#2F5D4F" stroke-width="1"/>
    <line x1="320" y1="-4" x2="320" y2="4" stroke="#2F5D4F" stroke-width="1"/>
    <line x1="-320" y1="-4" x2="-320" y2="4" stroke="#2F5D4F" stroke-width="1"/>
    <line x1="-4" y1="-220" x2="4" y2="-220" stroke="#2F5D4F" stroke-width="1"/>
    <line x1="-4" y1="220" x2="4" y2="220" stroke="#2F5D4F" stroke-width="1"/>
  </g>

  <!-- SEC-J axis labels -->
  <text x="148" y="296" fill="#2F5D4F" font-size="13" font-weight="500" opacity="0.18" letter-spacing="0.08em">S</text>
  <text x="692" y="296" fill="#2F5D4F" font-size="13" font-weight="500" opacity="0.18" letter-spacing="0.08em">E</text>
  <text x="416" y="126" fill="#2F5D4F" font-size="13" font-weight="500" opacity="0.18" letter-spacing="0.08em">C</text>
  <text x="416" y="482" fill="#2F5D4F" font-size="13" font-weight="500" opacity="0.25" letter-spacing="0.08em">J</text>

  <!-- Radial grid rings -->
  <circle cx="420" cy="300" r="80" fill="none" stroke="#2F5D4F" stroke-width="0.5" opacity="0.06"/>
  <circle cx="420" cy="300" r="160" fill="none" stroke="#2F5D4F" stroke-width="0.5" opacity="0.05"/>
  <circle cx="420" cy="300" r="240" fill="none" stroke="#2F5D4F" stroke-width="0.5" opacity="0.04"/>

  <!-- Domain letters A-J constellation -->
  <text x="340" y="195" fill="#2F5D4F" font-size="28" font-weight="600" opacity="0.10">A</text>
  <text x="510" y="175" fill="#2F5D4F" font-size="24" font-weight="600" opacity="0.08">B</text>
  <text x="580" y="240" fill="#2F5D4F" font-size="30" font-weight="600" opacity="0.11">C</text>
  <text x="260" y="260" fill="#2F5D4F" font-size="22" font-weight="600" opacity="0.07">D</text>
  <text x="490" y="330" fill="#2F5D4F" font-size="26" font-weight="600" opacity="0.09">E</text>
  <text x="310" y="370" fill="#2F5D4F" font-size="20" font-weight="600" opacity="0.07">F</text>
  <text x="560" y="390" fill="#2F5D4F" font-size="25" font-weight="600" opacity="0.09">G</text>
  <text x="380" y="430" fill="#2F5D4F" font-size="23" font-weight="600" opacity="0.08">H</text>
  <text x="240" y="345" fill="#2F5D4F" font-size="27" font-weight="600" opacity="0.10">I</text>
  <text x="470" y="440" fill="#2F5D4F" font-size="19" font-weight="600" opacity="0.06">J</text>

</svg>