<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mi-title mi-desc" style="font-family: Inter, 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <title id="mi-title">Multi-Impact Framework — 6 Dimensionen</title>
  <desc id="mi-desc">Six evaluation dimensions arranged in a hexagonal radar structure: GHG Accounting, Environmental, Social and Equity, Energy and Rebound, Governance, Systemic Pathways.</desc>

  <text x="300" y="36" text-anchor="middle" fill="#1A1A1A" font-size="18" font-weight="600" letter-spacing="0.03em">Multi-Impact Framework</text>
  <text x="300" y="56" text-anchor="middle" fill="#5C6360" font-size="12">Sechs gleichberechtigte Bewertungsdimensionen</text>

  <!-- Outer hexagon -->
  <polygon points="300,140 455.88,230 455.88,410 300,500 144.12,410 144.12,230"
           fill="none" stroke="#D4D8D6" stroke-width="1"/>

  <!-- Middle hexagon (66%) -->
  <polygon points="300,200 403.92,260 403.92,380 300,440 196.08,380 196.08,260"
           fill="none" stroke="#E8EFEB" stroke-width="0.75"/>

  <!-- Inner hexagon (33%) -->
  <polygon points="300,260 351.96,290 351.96,350 300,380 248.04,350 248.04,290"
           fill="none" stroke="#E8EFEB" stroke-width="0.75"/>

  <!-- Axis lines -->
  <line x1="300" y1="320" x2="300" y2="140" stroke="#D4D8D6" stroke-width="0.75"/>
  <line x1="300" y1="320" x2="455.88" y2="230" stroke="#D4D8D6" stroke-width="0.75"/>
  <line x1="300" y1="320" x2="455.88" y2="410" stroke="#D4D8D6" stroke-width="0.75"/>
  <line x1="300" y1="320" x2="300" y2="500" stroke="#D4D8D6" stroke-width="0.75"/>
  <line x1="300" y1="320" x2="144.12" y2="410" stroke="#D4D8D6" stroke-width="0.75"/>
  <line x1="300" y1="320" x2="144.12" y2="230" stroke="#D4D8D6" stroke-width="0.75"/>

  <!-- Example shape (dashed, conceptual) -->
  <polygon points="300,175 430,252 440,390 300,460 170,375 165,245"
           fill="#2F5D4F" fill-opacity="0.07" stroke="#2F5D4F" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- Center dot -->
  <circle cx="300" cy="320" r="3" fill="#5C6360"/>

  <!-- Vertex dots -->
  <circle cx="300" cy="140" r="4" fill="#2F5D4F"/>
  <circle cx="455.88" cy="230" r="4" fill="#2F5D4F"/>
  <circle cx="455.88" cy="410" r="4" fill="#2F5D4F"/>
  <circle cx="300" cy="500" r="4" fill="#2F5D4F"/>
  <circle cx="144.12" cy="410" r="4" fill="#2F5D4F"/>
  <circle cx="144.12" cy="230" r="4" fill="#2F5D4F"/>

  <!-- Labels -->
  <text x="300" y="118" text-anchor="middle" fill="#1A1A1A" font-size="12" font-weight="600">GHG Accounting</text>
  <text x="300" y="132" text-anchor="middle" fill="#9CA3A0" font-size="9">CO2, CH4, N2O, F-Gase</text>

  <text x="478" y="218" text-anchor="start" fill="#1A1A1A" font-size="12" font-weight="600">Environmental</text>
  <text x="478" y="232" text-anchor="start" fill="#9CA3A0" font-size="9">Wasser, Land, Biodiversität</text>

  <text x="478" y="416" text-anchor="start" fill="#1A1A1A" font-size="12" font-weight="600">Social &amp; Equity</text>
  <text x="478" y="430" text-anchor="start" fill="#9CA3A0" font-size="9">Verteilung, Co-Benefits, Jobs</text>

  <text x="300" y="526" text-anchor="middle" fill="#1A1A1A" font-size="12" font-weight="600">Energy &amp; Rebound</text>
  <text x="300" y="540" text-anchor="middle" fill="#9CA3A0" font-size="9">Energiebilanz, Rebound-Adjustment</text>

  <text x="122" y="416" text-anchor="end" fill="#1A1A1A" font-size="12" font-weight="600">Governance</text>
  <text x="122" y="430" text-anchor="end" fill="#9CA3A0" font-size="9">Greenwashing-Schutz, Compliance</text>

  <text x="122" y="218" text-anchor="end" fill="#1A1A1A" font-size="12" font-weight="600">Systemic Pathways</text>
  <text x="122" y="232" text-anchor="end" fill="#9CA3A0" font-size="9">Szenarien, Lock-in, Carbon Budget</text>

  <!-- Legend -->
  <g transform="translate(300, 574)">
    <line x1="-50" y1="0" x2="-30" y2="0" stroke="#2F5D4F" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="-24" y="4" fill="#9CA3A0" font-size="9">Beispielhafte Bewertungsform (keine realen Werte)</text>
  </g>

</svg>